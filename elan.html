<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elan detalı — Bina.az</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-emerald-600 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="bina.html" class="text-2xl font-extrabold tracking-tight">BINA.AZ</a>
      <button class="bg-white text-emerald-600 px-5 py-2.5 rounded-lg font-semibold">⊕ Yeni elan</button>
    </div>
  </header>
  <div class="max-w-6xl mx-auto px-4 py-6">
    <a href="bina.html" class="text-emerald-600 text-sm hover:underline">← Elanlara qayıt</a>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-4">
      <div class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-sm overflow-hidden"><img id="detailImage" src="" alt="Ev" class="w-full h-96 object-cover"></div>
        <div class="bg-white rounded-xl shadow-sm mt-6 p-6">
          <h2 class="text-lg font-bold text-gray-800 mb-4">Xüsusiyyətlər</h2>
          <div class="grid grid-cols-2 gap-y-4 text-sm">
            <p class="text-gray-500">Əmlakın növü</p><p id="detailType" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Otaq sayı</p><p id="detailRoom" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Sahə</p><p id="detailArea" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Mərtəbə</p><p id="detailFloor" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Tikili ili</p><p id="detailYear" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Təmir</p><p id="detailRepair" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Sənəd</p><p id="detailDocument" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Əşya</p><p id="detailFurniture" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Mənzərə</p><p id="detailView" class="text-gray-800 font-medium"></p>
            <p class="text-gray-500">Yerləşmə</p><p id="detailCity" class="text-gray-800 font-medium"></p>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm mt-6 p-6">
          <h2 class="text-lg font-bold text-gray-800 mb-3">Təsvir</h2>
          <p id="detailDescription" class="text-gray-600 text-sm leading-relaxed"></p>
        </div>
      </div>
      <div>
        <div class="bg-white rounded-xl shadow-sm p-6 sticky top-6">
          <h1 id="detailTitle" class="text-xl font-bold text-gray-800"></h1>
          <p id="detailPrice" class="text-emerald-600 font-extrabold text-3xl mt-3"></p>
          <p id="detailSummary" class="text-gray-500 text-sm mt-2"></p>
          <div class="mt-6 border-t border-gray-100 pt-4"><p class="text-gray-500 text-sm">Sahibkar</p><p class="text-gray-800 font-medium">Rəşad</p><p class="text-emerald-600 font-bold text-lg mt-2">(050) 123-45-67</p></div>
          <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-semibold mt-4">Zəng et</button>
          <button id="favoriteButton" class="w-full border border-emerald-600 text-emerald-600 hover:bg-emerald-50 py-3 rounded-lg font-semibold mt-3">♡ Seçilmişlərə əlavə et</button>
        </div>
      </div>
    </div>
  </div>
  <script src="cars.js"></script>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const ev = home.find(x => x.id === id) || home[0];
    const qiymet = new Intl.NumberFormat("az-AZ").format(ev.qiymet);

    document.title = `${ev.marka} • ${ev.model} — Bina.az`;
    document.getElementById("detailImage").src = ev.sekil;
    document.getElementById("detailType").textContent = ev.marka;
    document.getElementById("detailRoom").textContent = ev.model;
    document.getElementById("detailArea").textContent = `${ev.muherrik} m²`;
    document.getElementById("detailFloor").textContent = `${ev.yurus}-ci mərtəbə`;
    document.getElementById("detailYear").textContent = ev.il;
    document.getElementById("detailRepair").textContent = ev.ban;
    document.getElementById("detailDocument").textContent = ev.yanacaq;
    document.getElementById("detailFurniture").textContent = ev.suret;
    document.getElementById("detailView").textContent = ev.reng;
    document.getElementById("detailCity").textContent = ev.seher;
    document.getElementById("detailTitle").textContent = `${ev.marka} • ${ev.model}`;
    document.getElementById("detailPrice").textContent = `${qiymet} ₼`;
    document.getElementById("detailSummary").textContent = `${ev.muherrik} m² • ${ev.yurus}-ci mərtəbə • ${ev.seher}`;
    document.getElementById("detailDescription").textContent = `${ev.seher} ərazisində yerləşən ${ev.marka.toLowerCase()}, ${ev.model} mənzil satışa çıxarılıb. Mənzil ${ev.ban.toLowerCase()} vəziyyətdədir, ${ev.yanacaq.toLowerCase()} sənədi var və ${ev.suret.toLowerCase()} təqdim olunur. ${ev.reng} görünüşə malikdir. Ətrafda market, məktəb, nəqliyyat və digər gündəlik ehtiyaclar üçün imkanlar mövcuddur.`;

    const saved = JSON.parse(localStorage.getItem("secilmisler") || "[]");
    const favoriteButton = document.getElementById("favoriteButton");

    function yenile() {
      favoriteButton.textContent = saved.includes(ev.id) ? "♥ Seçilmişlərdən çıxar" : "♡ Seçilmişlərə əlavə et";
      const say = document.getElementById("sebetSay");
      if (say) say.textContent = saved.length;
    }

    favoriteButton.onclick = () => {
      const index = saved.indexOf(ev.id);
      if (index === -1) saved.push(ev.id);
      else saved.splice(index, 1);
      localStorage.setItem("secilmisler", JSON.stringify(saved));
      yenile();
    };

    yenile();
  </script>
</body>
</html>
