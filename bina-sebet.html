<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seçilmişlər — Bina.az</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-emerald-600 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="bina.html" class="text-2xl font-extrabold tracking-tight">BINA.AZ</a>
      <a href="bina.html" class="bg-white text-emerald-600 px-5 py-2.5 rounded-lg font-semibold">Elanlara bax</a>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Seçilmiş elanlar</h1>
    <div id="container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  </main>
  <script src="cars.js"></script>
  <script>
    const container = document.getElementById("container");
    const saved = JSON.parse(localStorage.getItem("secilmisler") || "[]");
    const data = home.filter(ev => saved.includes(ev.id));
    const format = x => new Intl.NumberFormat("az-AZ").format(x);

    if (!data.length) {
      container.innerHTML = '<div class="col-span-full bg-white rounded-xl p-10 text-center text-gray-500">Hələ seçilmiş elan yoxdur</div>';
    } else {
      data.forEach(ev => {
        const kart = document.createElement("div");
        kart.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden cursor-pointer border border-gray-100";
        kart.innerHTML = `<div class="relative"><img src="${ev.sekil}" alt="Ev" class="w-full h-48 object-cover"><span class="absolute top-3 left-3 bg-black/60 text-white text-xs px-2.5 py-1 rounded-md">${ev.seher}</span></div><div class="p-4"><p class="text-emerald-600 font-bold text-xl">${format(ev.qiymet)} ₼</p><h3 class="font-semibold text-gray-800 mt-1.5">${ev.marka} • ${ev.model}</h3><p class="text-gray-500 text-sm mt-1">${ev.muherrik} m² • ${ev.yurus}-ci mərtəbə • ${ev.il}</p><button class="mt-3 text-sm text-red-500 hover:underline">Seçilmişlərdən çıxar</button></div>`;
        kart.onclick = e => {
          if (e.target.tagName === "BUTTON") {
            const yeni = saved.filter(id => id !== ev.id);
            localStorage.setItem("secilmisler", JSON.stringify(yeni));
            location.reload();
          } else location.href = `elan.html?id=${ev.id}`;
        };
        container.appendChild(kart);
      });
    }
  </script>
</body>
</html>
